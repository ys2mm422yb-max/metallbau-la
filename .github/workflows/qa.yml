name: Static Site QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JavaScript syntax
        run: |
          node --check script.js
          node --check source-complete.js
          node --check .github/browser-qa.mjs
          node --check .github/source-complete-qa.mjs
          node --check .github/visual-extra-qa.mjs

      - name: Required files and demo safeguards
        run: |
          test -f index.html
          test -f styles.css
          test -f visual-fixes.css
          test -f source-complete.css
          test -f script.js
          test -f source-complete.js
          test -f SOURCE_AUDIT.md
          test -f data/treppen.json
          test -f data/tore.json
          test -f data/balkone.json
          test -f data/stahlbau.json
          test -f data/interior.json
          test -f data/medallions.json
          test -f .github/browser-qa.mjs
          test -f .github/source-complete-qa.mjs
          test -f .github/visual-extra-qa.mjs
          grep -q 'noindex,nofollow' index.html
          grep -q 'Unverbindliche Design-Demo' index.html
          grep -q 'EN 1090-2 EXC2' index.html
          grep -q 'info@larasser-metallbau.de' index.html
          grep -q 'source-complete.js' index.html
          grep -q 'source-complete.css' index.html
          grep -q "visual-fixes.css" script.js
          grep -q "Schachtisch" script.js
          grep -q "medallionsDescription" script.js
          grep -q "data/treppen.json" script.js
          grep -q "data/medallions.json" script.js
          grep -q "references-awaiting-selection" source-complete.js
          grep -q "references-awaiting-selection" source-complete.css
          grep -q "mobile menu destination" .github/browser-qa.mjs
          grep -q "medallion badge matches image count" .github/source-complete-qa.mjs
          grep -q "betrieb" .github/visual-extra-qa.mjs
          grep -q "form-fields" .github/visual-extra-qa.mjs
          grep -q "footer" .github/visual-extra-qa.mjs

      - name: Serve static site
        run: |
          python3 -m http.server 8080 >/tmp/metallbau-la-http.log 2>&1 &
          SERVER_PID=$!
          sleep 2
          curl --fail --silent --show-error http://127.0.0.1:8080/ > /tmp/index-rendered.html
          curl --fail --silent --show-error http://127.0.0.1:8080/visual-fixes.css > /tmp/visual-fixes.css
          curl --fail --silent --show-error http://127.0.0.1:8080/source-complete.css > /tmp/source-complete.css
          curl --fail --silent --show-error http://127.0.0.1:8080/source-complete.js > /tmp/source-complete.js
          curl --fail --silent --show-error http://127.0.0.1:8080/data/balkone.json > /tmp/balkone.json
          curl --fail --silent --show-error http://127.0.0.1:8080/data/stahlbau.json > /tmp/stahlbau.json
          curl --fail --silent --show-error http://127.0.0.1:8080/data/interior.json > /tmp/interior.json
          curl --fail --silent --show-error http://127.0.0.1:8080/data/medallions.json > /tmp/medallions.json
          grep -q '<title>Metallbau Larasser – Demo</title>' /tmp/index-rendered.html
          grep -q 'mobile menu destination' .github/browser-qa.mjs
          grep -q '.special-work' /tmp/visual-fixes.css
          grep -q 'reference-category-bar' /tmp/source-complete.css
          grep -q 'Category-first reference UX' /tmp/source-complete.js
          grep -q 'Balkon mit Solarkraftwerk' /tmp/balkone.json
          grep -q 'Carport für drei Fahrzeuge' /tmp/stahlbau.json
          grep -q 'Schachtisch' /tmp/interior.json
          grep -q 'fed3ff42-a233-4579-80c0-6bf92e2939e3' /tmp/medallions.json
          kill $SERVER_PID

      - name: Basic markup checks
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          html = Path('index.html').read_text(encoding='utf-8')
          required_ids = ['main', 'leistungen', 'referenzen', 'lohnfertigung', 'betrieb', 'anfrage', 'project-form']
          for element_id in required_ids:
              assert f'id="{element_id}"' in html, f'Missing id: {element_id}'

          class Parser(HTMLParser):
              def error(self, message):
                  raise AssertionError(message)

          Parser().feed(html)
          assert html.count('<h1') == 1, 'Expected exactly one H1'
          assert 'mailto:info@larasser-metallbau.de' in html, 'Missing central mail contact'
          print('Basic markup checks passed')
          PY

  responsive-browser-qa:
    runs-on: ubuntu-latest
    needs: qa
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium webkit

      - name: Start preview server
        run: |
          nohup python3 -m http.server 8080 >/tmp/metallbau-la-browser-qa-http.log 2>&1 &
          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8080/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/metallbau-la-browser-qa-http.log
          exit 1

      - name: Desktop Android and iPhone browser QA
        run: node .github/browser-qa.mjs

      - name: Betrieb form and footer visual QA
        run: node .github/visual-extra-qa.mjs

      - name: Source-complete category and image QA
        run: node .github/source-complete-qa.mjs

      - name: Upload responsive screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-browser-screenshots
          path: artifacts/browser-qa
          if-no-files-found: warn
          retention-days: 14
