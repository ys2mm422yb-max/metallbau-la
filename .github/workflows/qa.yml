name: Static Site QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JavaScript syntax
        run: |
          node --check parity.js
          node --check product-inquiry.js
          node --check launch-config.js
          node --check .github/parity-browser-qa.mjs

      - name: Required files and prelaunch safeguards
        run: |
          test -f index.html
          test -f parity.css
          test -f parity.js
          test -f reference-hub.css
          test -f product-inquiry.css
          test -f product-inquiry.js
          test -f launch-config.js
          test -f robots.txt
          test -f sitemap.xml
          test -f 404.html
          test -f PARITY_PLAN.md
          test -f SOURCE_AUDIT.md
          test -f assets/larasser-logo-mark.svg
          test -f assets/source/manifest.json
          test -f data/treppen.json
          test -f data/tore.json
          test -f data/balkone.json
          test -f data/stahlbau.json
          test -f data/interior.json
          test -f data/medallions.json
          test -f referenzen/index.html
          test -f referenzen/treppen-and-gelander/index.html
          test -f referenzen/tore-and-zaune/index.html
          test -f referenzen/balkone-and-terrassen/index.html
          test -f referenzen/carports-dacher-and-stahlbau/index.html
          test -f referenzen/interior/index.html
          test -f referenzen/medallions/index.html
          test -f referenzen/sonderanfertigungen/index.html
          test -f referenzen/lohnbiegen-and-lohnschneiden/index.html
          test -f uber-uns/index.html
          test -f kontakt/index.html
          test -f impressum/index.html
          test -f datenschutzerklarung/index.html
          test -f treppen-1/index.html
          grep -q 'Disallow: /' robots.txt
          grep -q "formEndpoint: ''" launch-config.js
          grep -q 'Unverbindliche technische Vorschau' index.html
          grep -q 'EN 1090-2 EXC2' index.html
          grep -q 'assets/larasser-logo-mark.svg' parity.css
          grep -q 'Sonderanfertigungen' referenzen/index.html
          grep -q 'data-part-inquiry' referenzen/lohnbiegen-and-lohnschneiden/index.html
          grep -q 'Bauteil anfragen' referenzen/lohnbiegen-and-lohnschneiden/index.html
          grep -q '/treppen-1/ /referenzen/treppen-and-gelander/ 301' _redirects
          ! grep -q '>29<' index.html
          ! grep -q 'Mitarbeiter</span>' index.html
          test "$(find assets/source -maxdepth 1 -type f ! -name manifest.json | wc -l)" -eq 190
          node -e "const m=require('./assets/source/manifest.json'); if(m.count!==190) process.exit(1)"
          ! grep -R -qE 'https://www\.larasser-metallbau\.de/wp-content/uploads/' index.html parity.css parity.js reference-hub.css product-inquiry.css product-inquiry.js referenzen uber-uns kontakt impressum datenschutzerklarung

      - name: Static content and local asset integrity
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import json, re

          pages = [
              Path('index.html'),
              Path('referenzen/index.html'),
              Path('referenzen/treppen-and-gelander/index.html'),
              Path('referenzen/tore-and-zaune/index.html'),
              Path('referenzen/balkone-and-terrassen/index.html'),
              Path('referenzen/carports-dacher-and-stahlbau/index.html'),
              Path('referenzen/interior/index.html'),
              Path('referenzen/medallions/index.html'),
              Path('referenzen/sonderanfertigungen/index.html'),
              Path('referenzen/lohnbiegen-and-lohnschneiden/index.html'),
              Path('uber-uns/index.html'),
              Path('kontakt/index.html'),
              Path('impressum/index.html'),
              Path('datenschutzerklarung/index.html'),
          ]

          class Parser(HTMLParser):
              def error(self, message):
                  raise AssertionError(message)

          for page in pages:
              html = page.read_text(encoding='utf-8')
              Parser().feed(html)
              assert 'name="robots" content="noindex,nofollow"' in html, f'noindex missing: {page}'
              assert html.count('<h1') == 1, f'expected one H1: {page}'
              assert 'parity.css' in html, f'parity css missing: {page}'
              for src in re.findall(r'<img[^>]+src="([^"]+)"', html):
                  if src.startswith(('http://','https://','data:')) or not src:
                      continue
                  target = (page.parent / src).resolve()
                  assert target.exists(), f'missing image {src} referenced by {page}'

          for data_file in ['treppen','tore','balkone','stahlbau','interior','medallions']:
              payload = json.loads(Path(f'data/{data_file}.json').read_text(encoding='utf-8'))
              images = payload.get('images', [])
              for project in payload.get('projects', []):
                  images.extend(project.get('images', []))
              for image in images:
                  assert Path(image).exists(), f'missing data asset: {image}'

          assert len(json.loads(Path('data/treppen.json').read_text())['projects']) == 9
          assert len(json.loads(Path('data/tore.json').read_text())['projects']) == 6
          assert len(json.loads(Path('data/balkone.json').read_text())['projects']) == 7
          assert len(json.loads(Path('data/stahlbau.json').read_text())['projects']) == 5
          assert len(json.loads(Path('data/interior.json').read_text())['projects']) == 9
          assert len(json.loads(Path('data/medallions.json').read_text())['images']) == 44

          special = Path('referenzen/sonderanfertigungen/index.html').read_text(encoding='utf-8')
          assert special.count('<article class="project">') == 6
          for name in ['Schachtisch', 'Feuerschale', 'Stehleuchte', 'Gastronomieeinrichtung', 'Grafinger Bär', 'Sisyphus']:
              assert name in special, f'Sonderanfertigung missing: {name}'

          production = Path('referenzen/lohnbiegen-and-lohnschneiden/index.html').read_text(encoding='utf-8')
          for token in ['data-part-inquiry', 'Rechteck', 'Rahmen', 'Dreieck', 'Freiform / Zeichnung', 'Bohrungsdurchmesser']:
              assert token in production, f'Bauteilanfrage token missing: {token}'

          sitemap = Path('sitemap.xml').read_text(encoding='utf-8')
          for route in [
              '/referenzen/', '/referenzen/interior/', '/referenzen/balkone-and-terrassen/',
              '/referenzen/tore-and-zaune/', '/referenzen/treppen-and-gelander/',
              '/referenzen/carports-dacher-and-stahlbau/', '/referenzen/medallions/',
              '/referenzen/sonderanfertigungen/', '/referenzen/lohnbiegen-and-lohnschneiden/',
              '/uber-uns/', '/kontakt/', '/impressum/', '/datenschutzerklarung/'
          ]:
              assert f'https://www.larasser-metallbau.de{route}' in sitemap, f'sitemap route missing: {route}'

          print('Static parity and local asset checks passed')
          PY

      - name: Serve static site smoke checks
        run: |
          python3 -m http.server 8080 >/tmp/metallbau-la-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8080/ >/dev/null; then break; fi
            sleep 1
          done
          for path in \
            / \
            /referenzen/ \
            /referenzen/interior/ \
            /referenzen/balkone-and-terrassen/ \
            /referenzen/tore-and-zaune/ \
            /referenzen/treppen-and-gelander/ \
            /referenzen/carports-dacher-and-stahlbau/ \
            /referenzen/medallions/ \
            /referenzen/sonderanfertigungen/ \
            /referenzen/lohnbiegen-and-lohnschneiden/ \
            /uber-uns/ \
            /kontakt/ \
            /impressum/ \
            /datenschutzerklarung/ \
            /assets/larasser-logo-mark.svg \
            /reference-hub.css \
            /product-inquiry.css \
            /product-inquiry.js \
            /data/treppen.json; do
              curl --fail --silent --show-error "http://127.0.0.1:8080${path}" >/dev/null
          done

  responsive-browser-qa:
    runs-on: ubuntu-latest
    needs: qa
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium webkit

      - name: Start preview server
        run: |
          nohup python3 -m http.server 8080 >/tmp/metallbau-la-browser-qa-http.log 2>&1 &
          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8080/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/metallbau-la-browser-qa-http.log
          exit 1

      - name: Desktop Android and iPhone parity QA
        run: node .github/parity-browser-qa.mjs

      - name: Upload parity screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parity-browser-screenshots
          path: artifacts/parity-browser-qa
          if-no-files-found: warn
          retention-days: 14
