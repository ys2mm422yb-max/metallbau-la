name: Static Site QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JavaScript syntax
        run: |
          node --check script.js
          node --check source-complete.js
          node --check .github/browser-qa.mjs
          node --check .github/source-complete-qa.mjs

      - name: Required files and demo safeguards
        run: |
          test -f index.html
          test -f styles.css
          test -f visual-fixes.css
          test -f source-complete.css
          test -f script.js
          test -f source-complete.js
          test -f SOURCE_AUDIT.md
          test -f .github/browser-qa.mjs
          test -f .github/source-complete-qa.mjs
          grep -q 'noindex,nofollow' index.html
          grep -q 'Unverbindliche Design-Demo' index.html
          grep -q 'EN 1090-2 EXC2' index.html
          grep -q 'info@larasser-metallbau.de' index.html
          grep -q 'source-complete.js' index.html
          grep -q 'source-complete.css' index.html
          grep -q "visual-fixes.css" script.js
          grep -q "Schachtisch" script.js
          grep -q "medallionsDescription" script.js
          grep -q "specialarbeiten" script.js
          grep -q "Interior project coverage incomplete" .github/browser-qa.mjs
          grep -q "Medallions filter" .github/browser-qa.mjs
          grep -q "balkone: 7" .github/source-complete-qa.mjs
          grep -q "stahlbau: 5" .github/source-complete-qa.mjs
          grep -q "expected 37 source-complete reference cards" .github/source-complete-qa.mjs

      - name: Serve static site
        run: |
          python3 -m http.server 8080 >/tmp/metallbau-la-http.log 2>&1 &
          SERVER_PID=$!
          sleep 2
          curl --fail --silent --show-error http://127.0.0.1:8080/ > /tmp/index-rendered.html
          curl --fail --silent --show-error http://127.0.0.1:8080/visual-fixes.css > /tmp/visual-fixes.css
          curl --fail --silent --show-error http://127.0.0.1:8080/source-complete.css > /tmp/source-complete.css
          curl --fail --silent --show-error http://127.0.0.1:8080/source-complete.js > /tmp/source-complete.js
          grep -q '<title>Metallbau Larasser – Demo</title>' /tmp/index-rendered.html
          grep -q 'open-menu header' .github/browser-qa.mjs
          grep -q '.special-work' /tmp/visual-fixes.css
          grep -q 'source-reference-card' /tmp/source-complete.css
          grep -q 'Balkon mit Solarkraftwerk' /tmp/source-complete.js
          grep -q 'Carport für drei Fahrzeuge' /tmp/source-complete.js
          kill $SERVER_PID

      - name: Basic markup checks
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          html = Path('index.html').read_text(encoding='utf-8')
          required_ids = ['main', 'leistungen', 'referenzen', 'lohnfertigung', 'betrieb', 'anfrage', 'project-form']
          for element_id in required_ids:
              assert f'id="{element_id}"' in html, f'Missing id: {element_id}'

          class Parser(HTMLParser):
              def error(self, message):
                  raise AssertionError(message)

          Parser().feed(html)
          assert html.count('<h1') == 1, 'Expected exactly one H1'
          assert 'mailto:info@larasser-metallbau.de' in html, 'Missing central mail contact'
          print('Basic markup checks passed')
          PY

  responsive-browser-qa:
    runs-on: ubuntu-latest
    needs: qa
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium webkit

      - name: Start preview server
        run: |
          nohup python3 -m http.server 8080 >/tmp/metallbau-la-browser-qa-http.log 2>&1 &
          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8080/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/metallbau-la-browser-qa-http.log
          exit 1

      - name: Desktop Android and iPhone browser QA
        run: node .github/browser-qa.mjs

      - name: Source-complete category QA
        run: node .github/source-complete-qa.mjs

      - name: Upload responsive screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-browser-screenshots
          path: artifacts/browser-qa
          if-no-files-found: warn
          retention-days: 14