<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <meta name="theme-color" content="#0d0f11" />
  <title>Seite nicht gefunden | Larasser Metallbau</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0d0f11; color: #f3f1eb; padding: 24px; }
    main { width: min(720px, 100%); }
    p { color: #b9b7b1; line-height: 1.6; }
    h1 { font-size: clamp(2.4rem, 8vw, 5rem); margin: 0 0 18px; line-height: .95; }
    a { display: inline-flex; margin-top: 12px; padding: 14px 18px; border: 1px solid #f3f1eb; color: inherit; text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <p>Fehler 404</p>
    <h1>Diese Seite gibt es nicht.</h1>
    <p>Die aufgerufene Adresse ist nicht mehr verfügbar oder wurde verschoben.</p>
    <a href="./">Zur Startseite</a>
  </main>
</body>
</html>
